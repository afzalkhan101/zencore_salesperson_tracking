name: Odoo 19 manifest auto-upgrade

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: odoo19-auto-upgrade-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump-affected-modules:
    # Default to a branch named "staging". Set the repository variable
    # ODOO_STAGING_BRANCH to use a different Odoo.sh staging branch.
    if: >-
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, '[skip odoo-auto-upgrade]') &&
      (github.ref_name == vars.ODOO_STAGING_BRANCH ||
       (vars.ODOO_STAGING_BRANCH == '' && github.ref_name == 'staging'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.ODOO_AUTO_UPGRADE_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate version automation
        run: python scripts/test_odoo_auto_upgrade.py

      - name: Detect changed modules and update manifests
        run: >-
          python scripts/odoo_auto_upgrade.py
          --base "${{ github.event.before }}"
          --head "${{ github.sha }}"
          --write

      - name: Commit manifest versions when required
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- */__manifest__.py; then
            echo "No affected installed-module manifest requires a version bump."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- */__manifest__.py
          git diff --cached --check
          git commit -m "chore(odoo): bump affected module versions [skip odoo-auto-upgrade]"

          # Never force-push. A non-fast-forward error means a newer push won
          # the race; that newer push triggers its own workflow run.
          git push origin "HEAD:${TARGET_BRANCH}"
