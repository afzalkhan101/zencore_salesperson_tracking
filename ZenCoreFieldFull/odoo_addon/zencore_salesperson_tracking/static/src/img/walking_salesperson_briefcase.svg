<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 72" width="48" height="72" role="img" aria-label="Walking salesperson carrying a small briefcase">
  <defs><filter id="sh" x="-40%" y="-30%" width="180%" height="170%"><feGaussianBlur stdDeviation="1.1"/></filter></defs>
  <ellipse cx="23" cy="68" rx="14" ry="2.1" fill="#16243A" opacity=".19" filter="url(#sh)"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Back walking leg and shoe -->
    <path d="M21 40 L16 52 L9 60" stroke="#243B55" stroke-width="5" fill="none"/>
    <path d="M9 60 L5 62 L12 63" stroke="#182736" stroke-width="3.6" fill="none"/>
    <!-- Front walking leg and shoe -->
    <path d="M27 40 L29 52 L38 60" stroke="#203850" stroke-width="5.2" fill="none"/>
    <path d="M38 60 L43 62 L35 63" stroke="#172B42" stroke-width="3.6" fill="none"/>
    <!-- Body, green field uniform -->
    <path d="M17 18 Q23 15 30 18 L32 39 L19 42 L15 28 Z" fill="#19AA52" stroke="#08733E" stroke-width="1.3"/>
    <path d="M23 19 L26 24" stroke="#BBF7D0" stroke-width="1.7"/>
    <!-- Rear arm moving behind body -->
    <path d="M18 23 L12 33 L8 37" fill="none" stroke="#B6764B" stroke-width="3.9"/>
    <path d="M8 37 L6 39" fill="none" stroke="#E0A477" stroke-width="2.9"/>
    <!-- Face and hair -->
    <path d="M21 6 Q29 3 31 11 Q32 17 26 19 Q19 18 19 12 Z" fill="#DE9B6B" stroke="#754A31" stroke-width=".7"/>
    <path d="M19 12 Q18 4 23 3 Q30 1 33 8 L31 12 L28 7 L24 8 L20 14 Z" fill="#162D40"/>
    <path d="M30 12 L33 14 L29 15" fill="#D68A5D"/>
    <!-- Front arm reaches down to SMALL hand-held bag -->
    <path d="M30 22 L35 33 L34 43" fill="none" stroke="#D99260" stroke-width="3.7"/>
    <circle cx="34" cy="43" r="1.9" fill="#E4A476"/>
    <!-- Briefcase is ~8 x 6px versus 60px figure height -->
    <path d="M32 46 V43.7 Q32 41.9 34 41.9 Q36 41.9 36 43.7 V46" fill="none" stroke="#53351F" stroke-width="1.1"/>
    <rect x="30" y="45" width="9" height="7" rx="1.2" fill="#98602F" stroke="#56351E" stroke-width=".9"/>
    <path d="M30.8 48.2 H38.2" stroke="#BB8449" stroke-width=".8"/>
    <rect x="33.7" y="47.4" width="1.6" height="1.6" rx=".3" fill="#E8C780"/>
  </g>
</svg>
